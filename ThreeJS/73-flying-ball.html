<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Kúla sem flýgur í gegnum kleinuhring</title> 
	</head>
	<body>
        <canvas id="c"  width="800" height="800"></canvas>
		<script src="js/three.js"></script>
        <script src="js/examples/js/controls/OrbitControls.js"></script>
		<script>
            // Ná í striga
            const canvas = document.querySelector('#c');

            // Skilgreina sviðsnet
			const scene = new THREE.Scene();
            scene.background = new THREE.Color('skyblue');
            
            // Skilgreina myndavél og staðsetja hana
			const camera = new THREE.PerspectiveCamera( 60, canvas.clientWidth/canvas.clientHeight, 0.1, 1000 );
			camera.position.set(5, 7, 10);

            // Bæta við músarstýringu
            const controls = new THREE.OrbitControls( camera, canvas );

            // Skilgreina birtingaraðferð með afbjögun (antialias)
			const renderer = new THREE.WebGLRenderer({canvas, antialias:true});

            // Búa til kleinuhring með Phong áferð (Phong material) og bæta í sviðsnetið
			const torusGeometry = new THREE.TorusGeometry( 2, 0.7, 16, 100 );
			const torusMaterial = new THREE.MeshPhongMaterial( { color: 0x1111ee } );
			const torus = new THREE.Mesh( torusGeometry, torusMaterial );
            torus.position.y += 3;
			scene.add( torus );

            // Búa til kúlu með Phong áferð og bæta í sviðsnetið
			const ballGeometry = new THREE.SphereGeometry( 0.6, 20, 40 );
			const ballMaterial = new THREE.MeshPhongMaterial( { color: 0xff0000 } );
			const ball = new THREE.Mesh( ballGeometry, ballMaterial );
            ball.position.y += 3;
			scene.add( ball );

            // Búa til gólfið með Phong áferð
            const floorGeometry = new THREE.PlaneGeometry( 20, 20 );
            const floorMaterial = new THREE.MeshPhongMaterial( { color: 0xcccccc } );
            const floor = new THREE.Mesh( floorGeometry, floorMaterial );
            floor.rotation.x = -0.5 * Math.PI;
            scene.add( floor );
            
            // Skilgreina ljósgjafa og bæta honum í sviðsnetið
            const light = new THREE.DirectionalLight(0xFFFFFF, 1);
            light.position.set(2, 4, 1);
            scene.add(light);

            // Hreyfifall
			const animate = function ( time ) {
                time *= 0.001;  // breyta í sekúndur
            
                const angle = 2*time;
                ball.position.set(Math.cos(angle)*2.7 + 2.7, ball.position.y, Math.sin(angle)*2.7);
            
				requestAnimationFrame( animate );

                controls.update();
				renderer.render( scene, camera );
			};

			animate();
		</script>
	</body>
</html>
